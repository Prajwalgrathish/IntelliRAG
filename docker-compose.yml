services:
  intellirag:
    build:
      context: .
      dockerfile: Dockerfile
    image: intellirag:latest
    container_name: intellirag
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./vector_store:/app/vector_store
      - ./models:/app/models
      - ./logs:/app/logs
      - ./evaluation:/app/evaluation
      - hf_cache:/app/.cache/huggingface
    restart: unless-stopped

volumes:
  hf_cache:
