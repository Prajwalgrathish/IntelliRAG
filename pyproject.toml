[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intellirag"
version = "1.0.0"
description = "IntelliRAG - Neural Document Intelligence & Retrieval-Augmented Generation Platform"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*", "src*"]

[tool.ruff]
line-length = 130
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008"]
